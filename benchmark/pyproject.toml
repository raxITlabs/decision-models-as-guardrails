[project]
name = "goldrails-bench"
version = "0.0.1"
description = "decision-models-as-guardrails benchmark: System One client, endpoint discovery, question sets, runs"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["goldrails-dataset", "typesafe-sdk>=0.7.1", "httpx>=0.27", "python-dotenv>=1.0", "boto3[crt]>=1.40", "pandas>=2.2", "matplotlib>=3.9", "tabulate>=0.9", "numpy>=1.26"]

[tool.uv.sources]
goldrails-dataset = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goldrails_bench*"]

[tool.setuptools.package-data]
goldrails_bench = ["tariffs.json"]
